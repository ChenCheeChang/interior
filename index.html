<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>室內裝修建材報價系統 300項</title>
<style>
:root{--bg:#0f1117;--bg2:#161b27;--bg3:#1e2535;--border:#2a3248;--accent:#3b82f6;--accent2:#10b981;--accent3:#f59e0b;--danger:#ef4444;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--card:#1a2234;--hl:rgba(59,130,246,.08);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:14px;min-height:100vh;}
/* Header */
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.hdr-l{display:flex;align-items:center;gap:10px;}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;}
.logo-t{font-size:14px;font-weight:700;}
.logo-s{font-size:10px;color:var(--text3);font-family:monospace;}
.badge{font-size:10px;padding:2px 9px;border-radius:20px;}
.b-blue{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3);}
.b-green{background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(16,185,129,.3);}
/* Toolbar */
.toolbar{padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
.search-wrap{position:relative;flex:1;min-width:180px;}
.search-wrap .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;}
input.search{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:9px 12px 9px 34px;color:var(--text);font-size:13px;outline:none;font-family:inherit;}
input.search:focus{border-color:var(--accent);}
select.sel{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:9px 12px;color:var(--text);font-size:12px;font-family:inherit;outline:none;cursor:pointer;}
select.sel:focus{border-color:var(--accent);}
/* Stats */
.stats{padding:8px 18px;display:flex;align-items:center;gap:12px;font-size:11px;color:var(--text3);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px;}
.count{margin-left:auto;color:var(--text2);}
.count span{color:var(--text);font-weight:600;}
/* Tabs */
.tabs{display:flex;gap:4px;padding:12px 18px 0;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{white-space:nowrap;padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:transparent;transition:all .18s;font-family:inherit;}
.tab:hover{border-color:var(--accent);color:var(--text);}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;}
/* Table */
.tbl-wrap{padding:12px 18px 80px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead tr{background:var(--bg3);border-bottom:2px solid var(--border);}
th{padding:9px 12px;text-align:left;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none;}
th:hover{color:var(--text2);}
th.sa::after{content:' ↑';color:var(--accent);}
th.sd::after{content:' ↓';color:var(--accent);}
tbody tr{border-bottom:1px solid var(--border);transition:background .12s;cursor:pointer;}
tbody tr:hover{background:var(--hl);}
tbody tr.hidden{display:none;}
td{padding:10px 12px;vertical-align:middle;}
.nm{font-weight:500;color:var(--text);}
.sp{font-size:10px;color:var(--text3);margin-top:1px;font-family:monospace;}
.cb{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;white-space:nowrap;}
.pl{color:#34d399;font-family:monospace;font-weight:600;}
.ph{color:#fbbf24;font-family:monospace;font-weight:600;}
.pa{font-family:monospace;font-weight:700;font-size:13px;}
.ul{color:var(--text3);font-size:10px;}
.tu{color:#f87171;font-size:10px;}
.td{color:#34d399;font-size:10px;}
.tf{color:var(--text3);font-size:10px;}
.nt{color:var(--text2);font-size:11px;max-width:180px;line-height:1.4;}
.hm{display:none;}
/* Modal */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:16px;}
.mbg.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;animation:su .22s ease;}
@keyframes su{from{transform:translateY(16px);opacity:0;}}
.mh{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
.mt{font-size:17px;font-weight:700;margin-bottom:3px;}
.ms{font-size:11px;color:var(--text3);}
.mx{background:var(--bg3);border:none;color:var(--text2);width:30px;height:30px;border-radius:6px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:10px;}
.mx:hover{background:var(--border);color:var(--text);}
.mb{padding:18px 20px;}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.mc{background:var(--bg3);border-radius:9px;padding:12px 14px;border:1px solid var(--border);}
.mcl{font-size:10px;color:var(--text3);margin-bottom:5px;letter-spacing:.04em;}
.mcv{font-size:19px;font-weight:700;font-family:monospace;}
.mcv.g{color:var(--accent2);}
.mcv.a{color:var(--accent3);}
.mcv.b{color:var(--accent);}
.mcu{font-size:11px;color:var(--text3);margin-left:3px;font-family:inherit;}
.rb{margin-top:12px;}
.rbl{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-bottom:5px;}
.rbt{background:var(--bg3);border-radius:3px;height:7px;}
.rbf{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent2),var(--accent3));}
.mst{font-size:10px;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px;font-weight:600;margin-top:14px;}
.msb{font-size:12px;color:var(--text2);line-height:1.65;background:var(--bg3);border-radius:7px;padding:10px 13px;}
.tgl{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.tgi{font-size:10px;padding:2px 9px;border-radius:20px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);}
/* Calc */
.cs{margin-top:14px;}
.cr{display:flex;gap:7px;align-items:center;margin-bottom:7px;}
.ci{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 11px;color:var(--text);font-size:13px;font-family:monospace;outline:none;}
.ci:focus{border-color:var(--accent);}
.cl{font-size:11px;color:var(--text3);width:36px;flex-shrink:0;}
.cres{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);border-radius:7px;padding:11px 13px;margin-top:7px;display:flex;justify-content:space-between;align-items:center;}
.crl{font-size:11px;color:var(--accent);}
.crb{font-size:10px;color:var(--text3);margin-top:2px;}
.crv{font-size:17px;font-weight:700;font-family:monospace;color:var(--accent);}
/* Empty */
.empty{text-align:center;padding:50px 20px;color:var(--text3);}
.empty-i{font-size:36px;margin-bottom:10px;}
/* Footer */
.footer{padding:10px 18px;font-size:10px;color:var(--text3);border-top:1px solid var(--border);font-family:monospace;}
@media(max-width:600px){.hm{display:none!important;}.hdr,.toolbar,.tbl-wrap,.tabs,.stats{padding-left:12px;padding-right:12px;}.mg{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-l">
    <div class="logo">🏗️</div>
    <div>
      <div class="logo-t">建材行情報價系統</div>
      <div class="logo-s">300項 · Interior Material Reference</div>
    </div>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;">
    <span class="badge b-blue">辦公室裝修</span>
    <span class="badge b-green">300項建材</span>
  </div>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <span class="ico">🔍</span>
    <input class="search" type="text" id="Q" placeholder="搜尋建材名稱、規格、用途..." oninput="filter()">
  </div>
  <select class="sel" id="SU" onchange="filter()">
    <option value="">全部單位</option>
    <option value="m²">m²</option>
    <option value="m">m（延米）</option>
    <option value="式">式</option>
    <option value="才">才</option>
    <option value="組">組</option>
    <option value="張">張</option>
    <option value="台">台</option>
    <option value="支">支</option>
    <option value="個">個</option>
    <option value="門">門</option>
    <option value="迴路">迴路</option>
    <option value="點">點</option>
  </select>
  <select class="sel" id="ST" onchange="filter()">
    <option value="">全部趨勢</option>
    <option value="up">↑ 漲價</option>
    <option value="flat">→ 持平</option>
    <option value="down">↓ 降價</option>
  </select>
</div>

<div class="stats">
  <span><span class="dot" style="background:#34d399"></span>市場低價</span>
  <span><span class="dot" style="background:#fbbf24"></span>市場高價</span>
  <span><span class="dot" style="background:#60a5fa"></span>平均行情</span>
  <span class="count">共 <span id="CNT">0</span> 項 · 點選查詳細</span>
</div>

<div class="tabs" id="TABS"></div>

<div class="tbl-wrap">
  <table>
    <thead>
      <tr>
        <th onclick="sort('cat')">類別</th>
        <th onclick="sort('name')">建材名稱</th>
        <th onclick="sort('low')">低於行情</th>
        <th onclick="sort('high')">高於行情</th>
        <th onclick="sort('avg')">平均行情</th>
        <th onclick="sort('unit')">單位</th>
        <th onclick="sort('trend')" class="hm">趨勢</th>
        <th class="hm">備註</th>
      </tr>
    </thead>
    <tbody id="TB"></tbody>
  </table>
  <div class="empty" id="EM" style="display:none">
    <div class="empty-i">📋</div>
    <div>找不到符合條件的建材</div>
  </div>
</div>

<div class="footer">⚡ 資料基準：2025年台北市辦公室裝修行情 · 含施工費，不含設計費 · 實際報價以現場丈量及廠商詢價為準</div>

<!-- Modal -->
<div class="mbg" id="MBG" onclick="closeMBG(event)">
  <div class="modal">
    <div class="mh">
      <div>
        <div class="mt" id="MTitle"></div>
        <div class="ms" id="MCat"></div>
      </div>
      <button class="mx" onclick="closeM()">✕</button>
    </div>
    <div class="mb">
      <div class="mg">
        <div class="mc"><div class="mcl">市場低價</div><div class="mcv g" id="ML"></div></div>
        <div class="mc"><div class="mcl">市場高價</div><div class="mcv a" id="MH"></div></div>
        <div class="mc"><div class="mcl">平均行情</div><div class="mcv b" id="MA"></div></div>
        <div class="mc"><div class="mcl">計費單位</div><div class="mcv" style="font-size:15px" id="MU"></div></div>
      </div>
      <div class="rb">
        <div class="rbl"><span id="MRL"></span><span id="MRH"></span></div>
        <div class="rbt"><div class="rbf" id="MRB" style="width:100%"></div></div>
      </div>
      <div class="mst">規格說明</div>
      <div class="msb" id="MSP"></div>
      <div class="mst">施工注意事項</div>
      <div class="msb" id="MNT"></div>
      <div class="mst">適用場合</div>
      <div class="tgl" id="MTG"></div>
      <!-- Calculator -->
      <div class="cs">
        <div class="mst">📐 快速估價計算機</div>
        <div class="cr">
          <span class="cl">數量</span>
          <input class="ci" type="number" id="CQ" placeholder="輸入數量" oninput="calc()" min="0">
          <span style="font-size:12px;color:var(--text3)" id="CUL"></span>
        </div>
        <div class="cr">
          <span class="cl">單價</span>
          <input class="ci" type="number" id="CUP" placeholder="預設平均行情" oninput="calc()">
          <span style="font-size:12px;color:var(--text3)">元</span>
        </div>
        <div class="cr">
          <span class="cl">損耗</span>
          <input class="ci" type="number" id="CW" value="10" oninput="calc()">
          <span style="font-size:12px;color:var(--text3)">%</span>
        </div>
        <div class="cres" id="CRES" style="display:none">
          <div>
            <div class="crl">預估總價（含損耗）</div>
            <div class="crb" id="CBK"></div>
          </div>
          <div class="crv" id="CTV"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const CAT_C={
  '地板':{bg:'rgba(99,102,241,.15)',c:'#818cf8'},
  '天花板':{bg:'rgba(14,165,233,.15)',c:'#38bdf8'},

  '空調':{bg:'rgba(56,189,248,.15)',c:'#7dd3fc'},
  '衛浴設備':{bg:'rgba(244,114,182,.15)',c:'#f472b6'},
  '茶水間廚具':{bg:'rgba(251,191,36,.15)',c:'#fbbf24'},
  '系統家具':{bg:'rgba(52,211,153,.15)',c:'#6ee7b7'},

  '拆除清運':{bg:'rgba(251,113,133,.15)',c:'#fda4af'},

  '資訊設備':{bg:'rgba(59,130,246,.15)',c:'#93c5fd'},
  '機電工程':{bg:'rgba(20,184,166,.15)',c:'#5eead4'},
  '雜項工程':{bg:'rgba(107,114,128,.15)',c:'#9ca3af'},

const TR={up:'<span class="tu">↑漲</span>',flat:'<span class="tf">→平</span>',down:'<span class="td">↓降</span>'};
const cc=k=>CAT_C[k]||{bg:'rgba(100,116,139,.15)',c:'#94a3b8'};

let data=[], curCat='全部', sk='', sd=1, curItem=null;

const data_raw = [
  // ===== 地板 =====
  {cat:'地板',name:'OA架高地板（含支撐腳）',spec:'600×600mm 鋼製面板，承重500kg/m²',low:1200,high:2800,avg:1800,unit:'m²',trend:'flat',note:'辦公室最常用，高度6~15cm可調，走線首選',tags:['辦公室','開放辦公區','電腦教室']},
  {cat:'地板',name:'OA架高地板（防靜電）',spec:'600×600mm 防靜電面板，電阻10⁶Ω',low:1800,high:3500,avg:2500,unit:'m²',trend:'flat',note:'伺服器機房、資訊室必備',tags:['機房','電腦教室','伺服器室']},
  {cat:'地板',name:'PVC地磚（商業用2.0mm）',spec:'2.0mm厚，耐磨層0.3mm，45×45cm',low:350,high:700,avg:500,unit:'m²',trend:'flat',note:'CP值高，施工快，常見於走廊',tags:['走廊','茶水間','一般辦公區']},
  {cat:'地板',name:'PVC地磚（商業用2.5mm）',spec:'2.5mm厚，耐磨層0.5mm，防滑R9',low:500,high:900,avg:680,unit:'m²',trend:'flat',note:'較耐久，適合人流量高區域',tags:['大廳','走廊','商業空間']},
  {cat:'地板',name:'PVC捲材地板',spec:'2mm厚，寬2m，每捲20m',low:400,high:850,avg:600,unit:'m²',trend:'flat',note:'無接縫，適合醫療類或無塵室',tags:['醫療空間','無塵室','特殊環境']},

  {cat:'地板',name:'地毯磚（高級款）',spec:'高密度羊毛混紡，9mm厚',low:1200,high:3000,avg:1800,unit:'m²',trend:'flat',note:'質感佳，適合高管或接待空間',tags:['主管室','貴賓室','接待廳']},
  {cat:'地板',name:'拋光石英磚（台製）',spec:'60×60cm，8mm厚',low:800,high:1800,avg:1200,unit:'m²',trend:'up',note:'台製CP值高，常見公共空間',tags:['大廳','走廊','廁所前廳']},
  {cat:'地板',name:'拋光石英磚（進口）',spec:'60×60cm，進口西班牙/義大利',low:1500,high:3500,avg:2200,unit:'m²',trend:'up',note:'質感較佳，花色多樣',tags:['接待廳','主管室','精品辦公室']},

data = data_raw;

// Categories
const cats = ['全部', ...Object.keys(CAT_C)];

function buildTabs(){
  document.getElementById('TABS').innerHTML = cats.map(c=>
    `<button class="tab${c===curCat?' active':''}" onclick="setCat('${c}')">${c}</button>`
  ).join('');
}

function setCat(c){ curCat=c; buildTabs(); filter(); }

function getCB(cat){
  const r=cc(cat);
  return `<span class="cb" style="background:${r.bg};color:${r.c}">${cat}</span>`;
}

function render(arr){
  document.getElementById('TB').innerHTML = arr.map((d,i)=>`
    <tr data-idx="${i}" onclick="openM(${data_raw.indexOf(d)})">
      <td>${getCB(d.cat)}</td>
      <td><div class="nm">${d.name}</div><div class="sp">${d.spec}</div></td>
      <td class="pl">$${d.low.toLocaleString()}</td>
      <td class="ph">$${d.high.toLocaleString()}</td>
      <td><span class="pa">$${d.avg.toLocaleString()}</span></td>
      <td><span class="ul">${d.unit}</span></td>
      <td class="hm">${TR[d.trend]}</td>
      <td class="hm nt">${d.note}</td>
    </tr>`).join('');
  document.getElementById('CNT').textContent = arr.length;
}

function filter(){
  const q=document.getElementById('Q').value.toLowerCase();
  const su=document.getElementById('SU').value;
  const st=document.getElementById('ST').value;
  const rows=document.getElementById('TB').querySelectorAll('tr');
  let c=0;
  data_raw.forEach((d,i)=>{
    const mc=curCat==='全部'||d.cat===curCat;
    const mq=!q||d.name.toLowerCase().includes(q)||d.spec.toLowerCase().includes(q)||d.cat.includes(q)||d.tags.join('').includes(q)||d.note.toLowerCase().includes(q);
    const mu=!su||d.unit===su;
    const mt=!st||d.trend===st;
    const show=mc&&mq&&mu&&mt;
    if(rows[i]) rows[i].classList.toggle('hidden',!show);
    if(show) c++;
  });
  document.getElementById('CNT').textContent=c;
  document.getElementById('EM').style.display=c===0?'block':'none';
}

function sort(k){
  if(sk===k) sd*=-1; else{sk=k;sd=1;}
  document.querySelectorAll('th').forEach(t=>t.className=t.className.replace(/\bsa\b|\bsd\b/g,'').trim());
  const sorted=[...data_raw].sort((a,b)=>{
    let va=a[k],vb=b[k];
    return(typeof va==='string'?va.localeCompare(vb):(va-vb))*sd;
  });
  render(sorted);
  filter();
}

let ci=null;
function openM(idx){
  ci=data_raw[idx];
  const d=ci;
  document.getElementById('MTitle').textContent=d.name;
  document.getElementById('MCat').textContent=`${d.cat} · ${d.spec}`;
  document.getElementById('ML').innerHTML=`$${d.low.toLocaleString()}<span class="mcu">/${d.unit}</span>`;
  document.getElementById('MH').innerHTML=`$${d.high.toLocaleString()}<span class="mcu">/${d.unit}</span>`;
  document.getElementById('MA').innerHTML=`$${d.avg.toLocaleString()}<span class="mcu">/${d.unit}</span>`;
  document.getElementById('MU').textContent=d.unit;
  document.getElementById('MRL').textContent=`低 $${d.low.toLocaleString()}`;
  document.getElementById('MRH').textContent=`高 $${d.high.toLocaleString()}`;
  document.getElementById('MSP').textContent=d.spec;
  document.getElementById('MNT').textContent=d.note;
  const tgs=[...d.tags,d.trend==='up'?'⚠️近期漲價':d.trend==='down'?'✅近期降價':''];
  document.getElementById('MTG').innerHTML=tgs.filter(Boolean).map(t=>`<span class="tgi">${t}</span>`).join('');
  document.getElementById('CQ').value='';
  document.getElementById('CUP').value=d.avg;
  document.getElementById('CW').value=10;
  document.getElementById('CUL').textContent=d.unit;
  document.getElementById('CRES').style.display='none';
  document.getElementById('MBG').classList.add('show');
}

function calc(){
  if(!ci) return;
  const qty=parseFloat(document.getElementById('CQ').value)||0;
  const up=parseFloat(document.getElementById('CUP').value)||ci.avg;
  const w=parseFloat(document.getElementById('CW').value)||0;
  if(qty<=0){document.getElementById('CRES').style.display='none';return;}
  const base=qty*up, waste=base*(w/100), total=base+waste;
  document.getElementById('CTV').textContent=`$${Math.round(total).toLocaleString()}`;
  document.getElementById('CBK').textContent=`${qty} ${ci.unit} × $${up.toLocaleString()} + 損耗 $${Math.round(waste).toLocaleString()}`;
  document.getElementById('CRES').style.display='flex';
}

function closeMBG(e){ if(e.target===document.getElementById('MBG')) closeM(); }
function closeM(){ document.getElementById('MBG').classList.remove('show'); }

buildTabs();
render(data_raw);
</script>
